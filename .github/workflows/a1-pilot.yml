name: Build A1 pilot SQLite

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_kaikki.py'
      - 'data/samples/a1_pilot.csv'
      - '.github/workflows/a1-pilot.yml'
      - 'schema/schema.sql'
      - 'src/examlex_lexicon/**'

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download a small Kaikki Simple English source
        run: |
          mkdir -p build
          curl --fail --location --retry 3 \
            'https://kaikki.org/simplewiktionary/raw-wiktextract-data.jsonl.gz' \
            --output build/simplewiktionary.jsonl.gz
          gzip --test build/simplewiktionary.jsonl.gz
      - name: Import limited A1 pilot headwords
        run: |
          PYTHONPATH=src python scripts/import_kaikki.py \
            --wordlist data/samples/a1_pilot.csv \
            --input build/simplewiktionary.jsonl.gz \
            --source-kind simple \
            --db build/examlex-a1-pilot.db \
            --report build/a1-import-report.json
          PYTHONPATH=src python -m examlex_lexicon --db build/examlex-a1-pilot.db validate
      - name: Check representative coverage
        run: |
          python - <<'PY'
          import json
          with open("build/a1-import-report.json", encoding="utf-8") as file:
              report = json.load(file)
          assert report["matched"] >= 10, report
          assert report["database_counts"]["senses"] >= 10, report
          print("Matched A1 pilot words:", report["matched"])
          PY
      - name: Include source attribution
        run: cp docs/A1_PILOT_ATTRIBUTION.md build/ATTRIBUTION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: examlex-a1-pilot-sqlite
          path: |
            build/examlex-a1-pilot.db
            build/a1-import-report.json
            build/ATTRIBUTION.txt
          retention-days: 14

      - name: Publish immutable pilot release for ExamLex updater
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="lexicon-a1-pilot-v0.1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace an immutable installed dictionary version."
            exit 0
          fi
          cp build/examlex-a1-pilot.db build/examlex-lexicon.db
          python - <<'PY'
          import json, hashlib, os, sqlite3
          path = "build/examlex-lexicon.db"
          con = sqlite3.connect(path)
          assert con.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
          assert con.execute("PRAGMA user_version").fetchone()[0] == 1
          count = con.execute("SELECT COUNT(*) FROM entries").fetchone()[0]
          con.close()
          digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
          manifest = {
              "schema_version": 1,
              "version": "lexicon-a1-pilot-v0.1.0",
              "filename": "examlex-lexicon.db",
              "sha256": digest,
              "entry_count": count,
              "description": "120-word selection, partially matched with Simple Wiktionary. Not the full Oxford A1 word list.",
              "attribution_file": "ATTRIBUTION.txt",
          }
          with open("build/lexicon-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          PY
          gh release create "$TAG" --target "$GITHUB_SHA" --title "ExamLex Lexicon A1 pilot 0.1.0" --notes "Initial, small development pilot vocabulary built from public Simple Wiktionary/Kaikki with source attribution. This is NOT the complete Oxford A1 list. Read ATTRIBUTION.txt and SOURCES.md before redistribution." --latest \
            build/examlex-lexicon.db build/lexicon-manifest.json build/ATTRIBUTION.txt
