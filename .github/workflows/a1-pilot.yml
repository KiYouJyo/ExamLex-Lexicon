name: Build A1 pilot SQLite

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_kaikki.py'
      - 'scripts/fetch_kaikki_english_words.py'
      - 'data/samples/a1_pilot.csv'
      - '.github/workflows/a1-pilot.yml'
      - 'schema/schema.sql'
      - 'src/examlex_lexicon/**'
      - 'docs/A1_PILOT_ATTRIBUTION.md'

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download selected lemmas from full English Wiktionary / Kaikki
        run: |
          PYTHONPATH=src python scripts/fetch_kaikki_english_words.py \
            --wordlist data/samples/a1_pilot.csv \
            --output build/enwiktionary-a1-subset.jsonl \
            --report build/kaikki-download-report.json
      - name: Import full English Wiktionary into A1 SQLite pilot
        run: |
          PYTHONPATH=src python scripts/import_kaikki.py \
            --wordlist data/samples/a1_pilot.csv \
            --input build/enwiktionary-a1-subset.jsonl \
            --source-kind en \
            --cefr-source 'Manual A1 pilot selection (Oxford-referenced)' \
            --db build/examlex-a1-pilot.db \
            --report build/a1-import-report.json
          PYTHONPATH=src python -m examlex_lexicon --db build/examlex-a1-pilot.db validate
      - name: Check representative coverage
        run: |
          python - <<'PY'
          import json
          with open("build/a1-import-report.json", encoding="utf-8") as file:
              report = json.load(file)
          assert report["matched"] >= 10, report
          assert report["database_counts"]["senses"] >= 10, report
          assert not any(
              row["word"] == "about" and row["pos"] in ("prep", "adv")
              for row in report["missing_word_pos"]
          ), report
          import sqlite3
          with sqlite3.connect("build/examlex-a1-pilot.db") as conn:
              pos = {row[0] for row in conn.execute(
                  "SELECT DISTINCT s.part_of_speech FROM senses s "
                  "JOIN entries e ON e.id=s.entry_id "
                  "WHERE e.normalized_headword='about'"
              )}
          assert {"prep", "adv"}.issubset(pos), pos
          print("Matched pilot words:", report["matched"])
          print("Unmatched word/POS combinations:", report["missing_word_pos"])
          PY
      - name: Include source attribution
        run: cp docs/A1_PILOT_ATTRIBUTION.md build/ATTRIBUTION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: examlex-a1-pilot-sqlite
          path: |
            build/examlex-a1-pilot.db
            build/a1-import-report.json
            build/kaikki-download-report.json
            build/ATTRIBUTION.txt
          retention-days: 14

      - name: Publish immutable pilot release for ExamLex updater
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="lexicon-a1-pilot-v0.2.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace an immutable installed dictionary version."
            exit 0
          fi
          cp build/examlex-a1-pilot.db build/examlex-lexicon.db
          python - <<'PY'
          import json, hashlib, os, sqlite3
          path = "build/examlex-lexicon.db"
          con = sqlite3.connect(path)
          assert con.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
          assert con.execute("PRAGMA user_version").fetchone()[0] == 1
          count = con.execute("SELECT COUNT(*) FROM entries").fetchone()[0]
          con.close()
          digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
          manifest = {
              "schema_version": 1,
              "version": "lexicon-a1-pilot-v0.2.1",
              "filename": "examlex-lexicon.db",
              "sha256": digest,
              "entry_count": count,
              "description": "120-word manual A1 selection from full English Wiktionary; 122/122 A1 POS pairs; not the full Oxford A1 list.",
              "attribution_file": "ATTRIBUTION.txt",
          }
          with open("build/lexicon-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          PY
          gh release create "$TAG" --target "$GITHUB_SHA" --title "ExamLex Lexicon A1 pilot 0.2.1" --notes "Initial, small development pilot vocabulary built from full English Wiktionary/Kaikki with source attribution. This is NOT the complete Oxford A1 list. Read ATTRIBUTION.txt and SOURCES.md before redistribution." --latest \
            build/examlex-lexicon.db build/lexicon-manifest.json build/a1-import-report.json build/ATTRIBUTION.txt
