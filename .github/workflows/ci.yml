name: Database checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Initialize and validate sample database
        run: |
          PYTHONPATH=src python -m examlex_lexicon --db build/check.db init
          PYTHONPATH=src python -m examlex_lexicon --db build/check.db seed-demo
          PYTHONPATH=src python -m examlex_lexicon --db build/check.db validate
