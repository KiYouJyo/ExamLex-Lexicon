name: Probe Kaikki English download link

on:
  push:
    paths:
      - '.github/workflows/check-word-download.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Kaikki full English word JSONL link
        run: |
          python - <<'PY'
          import re, urllib.request
          u = "https://kaikki.org/dictionary/English/meaning/a/ab/about.html"
          with urllib.request.urlopen(urllib.request.Request(
              u, headers={"User-Agent": "ExamLex-Lexicon/0.2 (+https://github.com/KiYouJyo/ExamLex-Lexicon)"}
          ), timeout=30) as f:
              html = f.read().decode("utf-8")
          print("HTML_BYTES", len(html))
          print("JSONL LINKS", re.findall(r'href=["\']([^"\']+\.jsonl)["\']', html)[-8:])
          p = html.rfind("raw JSONL data for about")
          print("DOWNLOAD NEAR", html[max(0,p-500):p+100].replace("\n"," ")[:700])
          PY
